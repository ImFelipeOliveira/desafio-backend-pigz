services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symfony_app
    env_file:
      - .env
      - .env.dev
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - symfony

  nginx:
    image: nginx:alpine
    container_name: symfony_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - symfony
    depends_on:
      - app

  db:
    image: mysql:latest
    container_name: symfony_db
    restart: unless-stopped
    env_file:
      - .env
      - .env.dev
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - symfony

  redis:
    image: redis:alpine
    container_name: symfony_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - symfony

networks:
  symfony:
    driver: bridge

volumes:
  db_data:
