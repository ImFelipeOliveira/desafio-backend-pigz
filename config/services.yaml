# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: "../src/"

    App\Domain\Repositories\UserRepositoryInterface:
        alias: App\Infra\Persistence\Doctrine\Repository\UserRepository
        public: false

    App\Domain\Repositories\VehicleRepositoryInterface:
        alias: App\Infra\Persistence\Doctrine\Repository\VehicleRepository
        public: false

    App\Domain\Repositories\FipeEntryRepositoryInterface:
        alias: App\Infra\Persistence\Doctrine\Repository\FipeEntryRepository
        public: false

    # JWT Manager
    App\Infra\Adapter\Jwt\FirebaseJwtManager:
        arguments:
            $privateKeyPath: "%env(resolve:JWT_PRIVATE_KEY_PATH)%"
            $publicKeyPath: "%env(resolve:JWT_PUBLIC_KEY_PATH)%"
            $ttl: "%env(int:JWT_TTL)%"

    App\Application\Security\JwtManagerInterface: '@App\Infra\Adapter\Jwt\FirebaseJwtManager'

    # FIPE Service (API adapter)
    App\Domain\Services\FipeServiceInterface:
        alias: App\Infra\Adapter\Fipe\FipeApiClient
        public: false

    # HTTP Client for FIPE API
    App\Infra\Adapter\Fipe\FipeApiClient:
        arguments:
            $httpClient: "@http_client"
            $logger: "@logger"

    # Use Cases
    App\Application\UseCase\:
        resource: "../src/Application/UseCase/*"
        autowire: true
        autoconfigure: true
        public: false

    # Voters (autoconfigured automatically, but can be explicit if needed)
    App\Infra\Security\Voter\:
        resource: "../src/Infra/Security/Voter/*"
        autowire: true
        autoconfigure: true
        tags: ["security.voter"]

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
